name: Contracts and Core
on: [push, pull_request]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install jsonschema==4.26.0
      - run: python build_contracts.py
      - run: python verify_contracts.py
      - run: git diff --exit-code -- contracts.schema.json examples/ validation-results.json src/browser-limits.generated.ts native/Sources/AriadneHost/BrowserReadBudget.generated.swift
  swift-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path native
      - run: swift test --package-path native
